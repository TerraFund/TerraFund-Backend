spring.application.name=TerraFund

# ---------------------------------------------------------------------------
# SECURITY: all credentials are provided via environment variables.
# Copy .env.example to .env, fill in the values, and never commit real ones.
# NOTE: the previous values were committed to git history -> ROTATE them all
# (database password, Gmail app password, JWT secret).
# ---------------------------------------------------------------------------

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/terrafund}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Mail ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@terrafund.org}
spring.mail.password=${MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JWT ---
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# --- Security toggles ---
# Set to true in production (HTTPS) so the refresh-token cookie is never sent over plain HTTP.
application.security.cookie-secure=false

# Frontend base URL used to build password-reset links
application.frontend.base-url=${FRONTEND_URL:http://localhost:3000}

# --- File uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Actuator: expose health only ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=order
