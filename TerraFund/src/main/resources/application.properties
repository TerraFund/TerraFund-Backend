spring.application.name=TerraFund

spring.datasource.url=jdbc:postgresql://REDACTED-DB-HOST/TerraFundDB?user=neondb_owner&password=REDACTED-DB-PASSWORD&sslmode=require&channelBinding=require

spring.datasource.username=neondb_owner
spring.datasource.password=REDACTED-DB-PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

application.security.jwt.secret-key=REDACTED-JWT-SECRET
